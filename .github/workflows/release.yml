# Release workflow for the noxy_game_engine process extension. Ebiten needs
# cgo on Linux and macOS, so each OS builds natively (no CGO_ENABLED=0
# cross-compile matrix); the last job merges the per-platform checksum files
# into the checksums.txt that `noxy --get` expects, and publishes everything
# as assets on the GitHub release for the tag. The asset names are the ones
# listed under [binaries] in noxy_ext.toml.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: ubuntu-latest
            arch: amd64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - run: sh release/build.sh game ${{ matrix.arch }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && cat checksums-*.txt > checksums.txt && rm checksums-*.txt && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
