name = "game"
abi = 1
kind = "process"
min_noxy = "0.23.0"
concurrency = "single"          # um jogo, um loop: uma chamada por vez
capabilities = ["display", "fs"] # janela e som; load_image/load_sound leem arquivos

[binaries]                      # release assets; noxy --get baixa o do seu OS/arch
windows-amd64 = "noxy-plugin-game-windows-amd64.exe"
linux-amd64   = "noxy-plugin-game-linux-amd64"
darwin-amd64  = "noxy-plugin-game-darwin-amd64"
darwin-arm64  = "noxy-plugin-game-darwin-arm64"

[[export]]
name = "game_init"              # (width, height, title): abre a janela
params = ["int", "int", "string"]
returns = "void"
stateful = true

[[export]]
name = "game_flip"              # (commands): mostra o frame, espera o proximo tick, devolve o input
params = ["any[]"]
returns = "map[string]any"
timeout_ms = 10000

[[export]]
name = "game_load_image"        # (path) -> {"id", "width", "height"}
params = ["string"]
returns = "map[string]any"
stateful = true

[[export]]
name = "game_quit"
params = []
returns = "void"

[[export]]
name = "game_text_width"        # (s, size, font_id) -> largura em px
params = ["string", "int", "int"]
returns = "float"

[[export]]
name = "game_load_font"         # (path) -> {"id"}; TTF ou OTF
params = ["string"]
returns = "map[string]any"
stateful = true

[[export]]
name = "game_set_fullscreen"    # (on): janela cheia; o Layout escala e faz letterbox
params = ["bool"]
returns = "void"
stateful = true

[[export]]
name = "game_add_gamepad_mapping"  # (linhas SDL_GameControllerDB): nomeia botoes de controles desconhecidos
params = ["string"]
returns = "void"
stateful = true

[[export]]
name = "game_set_fps"           # (n >= 1): ticks por segundo (padrao 60)
params = ["int"]
returns = "void"
stateful = true

[[export]]
name = "game_load_sound"        # (path) -> {"id"}; WAV ou OGG inteiro na memoria
params = ["string"]
returns = "map[string]any"
stateful = true

[[export]]
name = "game_play_sound"        # (id): toca do inicio, sobreposicao livre
params = ["int"]
returns = "void"
stateful = true

[[export]]
name = "game_play_music"        # (path): streaming em loop; troca a musica atual
params = ["string"]
returns = "void"
stateful = true

[[export]]
name = "game_stop_music"
params = []
returns = "void"
stateful = true

[[export]]
name = "game_set_volume"        # (v 0..1): musica na hora, sons no proximo play
params = ["float"]
returns = "void"
stateful = true
